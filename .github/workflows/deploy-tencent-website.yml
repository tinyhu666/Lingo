name: Deploy Tencent Website

on:
  workflow_dispatch:
    inputs:
      website_ref:
        description: lingoweb branch, tag, or commit to deploy
        required: true
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TENCENT_LIGHT_HOST: ${{ secrets.TENCENT_LIGHT_HOST }}
      TENCENT_LIGHT_USER: ${{ secrets.TENCENT_LIGHT_USER }}
      TENCENT_LIGHT_SSH_KEY: ${{ secrets.TENCENT_LIGHT_SSH_KEY }}
      TENCENT_LIGHT_PORT: ${{ vars.TENCENT_LIGHT_PORT }}
      TENCENT_LIGHT_TARGET_DIR: ${{ vars.TENCENT_LIGHT_TARGET_DIR }}
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v5
        with:
          repository: tinyhu666/lingoweb
          ref: ${{ inputs.website_ref }}
          path: website-src

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: website-src/package-lock.json

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          if [ -z "${TENCENT_LIGHT_HOST:-}" ]; then
            echo "TENCENT_LIGHT_HOST secret is required."
            missing=1
          fi

          if [ -z "${TENCENT_LIGHT_USER:-}" ]; then
            echo "TENCENT_LIGHT_USER secret is required."
            missing=1
          fi

          if [ -z "${TENCENT_LIGHT_SSH_KEY:-}" ]; then
            echo "TENCENT_LIGHT_SSH_KEY secret is required."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          deploy_target_dir="${TENCENT_LIGHT_TARGET_DIR:-/home/ubuntu/lingo-translate-proxy}"
          echo "DEPLOY_PORT=${TENCENT_LIGHT_PORT:-22}" >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET_DIR=$deploy_target_dir" >> "$GITHUB_ENV"
          echo "DEPLOY_WEBSITE_DIR=${deploy_target_dir}/public-sites/lingoweb" >> "$GITHUB_ENV"

      - name: Install website dependencies
        working-directory: website-src
        run: npm ci

      - name: Build website
        working-directory: website-src
        run: npm run build

      - name: Prepare website bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -czf lingoweb-dist.tgz -C website-src/dist .

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$TENCENT_LIGHT_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" "$TENCENT_LIGHT_HOST" >> ~/.ssh/known_hosts

      - name: Upload website bundle
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$DEPLOY_PORT" lingoweb-dist.tgz "${TENCENT_LIGHT_USER}@${TENCENT_LIGHT_HOST}:/tmp/lingoweb-dist.tgz"

      - name: Deploy website on Tencent light server
        shell: bash
        run: |
          set -euo pipefail

          ssh -p "$DEPLOY_PORT" "${TENCENT_LIGHT_USER}@${TENCENT_LIGHT_HOST}" "DEPLOY_WEBSITE_DIR='$DEPLOY_WEBSITE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          website_dir="${DEPLOY_WEBSITE_DIR:?DEPLOY_WEBSITE_DIR is required}"

          case "$website_dir" in
            /opt/*|/srv/*|/home/*) ;;
            *)
              echo "Refusing to deploy website into unsafe target dir: $website_dir"
              exit 1
              ;;
          esac

          mkdir -p "$website_dir"
          find "$website_dir" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xzf /tmp/lingoweb-dist.tgz -C "$website_dir"
          rm -f /tmp/lingoweb-dist.tgz

          deployed_bundle="$(grep -o 'index-[A-Za-z0-9_-]*\.js' "$website_dir/index.html" | head -n 1 || true)"
          echo "::notice::Deployed website bundle ${deployed_bundle:-unknown} into $website_dir"

          # The edge server may answer plain HTTP with a redirect to HTTPS (Caddy does),
          # so follow redirects while pinning both ports to the local listener.
          check_file="$(mktemp)"
          check_result="$(curl --retry 5 --retry-all-errors --retry-delay 1 -sS -L -k --max-time 20 \
            --resolve buffpp.com:80:127.0.0.1 --resolve buffpp.com:443:127.0.0.1 \
            -o "$check_file" -w '%{http_code} %{url_effective}' http://buffpp.com/ || true)"
          echo "::notice::Local site check: ${check_result:-no response}"

          if ! grep -qi '<!doctype html' "$check_file"; then
            echo "::error::Local site check did not return the website HTML (${check_result:-no response})"
            rm -f "$check_file"
            exit 1
          fi
          rm -f "$check_file"
          REMOTE

      - name: Verify public site
        shell: bash
        run: |
          set -euo pipefail

          expected="$(grep -o 'index-[A-Za-z0-9_-]*\.js' website-src/dist/index.html | head -n 1)"
          served=0

          for host in lingo.ink www.lingo.ink buffpp.com; do
            url="https://$host/"
            addresses="$(dig +short A "$host" 2>/dev/null | paste -sd, - || true)"
            body_file="$(mktemp)"
            status="$(curl -sSL --max-time 20 --retry 3 --retry-delay 2 -o "$body_file" -w '%{http_code}' "$url" 2>/dev/null || echo "000")"
            title="$(grep -o '<title>[^<]*</title>' "$body_file" | head -n 1 || true)"
            bundle="$(grep -o 'index-[A-Za-z0-9_-]*\.js' "$body_file" | head -n 1 || true)"
            rm -f "$body_file"

            if [ "$bundle" = "$expected" ]; then
              echo "::notice::$url serves the new bundle $expected (dns ${addresses:-none}, http $status)"
              served=1
            else
              echo "::warning::$url does not serve $expected yet (dns ${addresses:-none}, http $status, bundle ${bundle:-none}, ${title:-no title})"
            fi
          done

          if [ "$served" -ne 1 ]; then
            echo "::error::Neither public domain serves the freshly deployed bundle $expected"
            exit 1
          fi
