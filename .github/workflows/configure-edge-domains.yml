name: Configure Edge Domains

# Manages which public website domains the Nginx edge on the Tencent light
# server answers for, without shell access to the server.
#
#   inspect     report the current Nginx server blocks, certificates and DNS
#   prepare     add lingo.ink / www.lingo.ink to the buffpp.com server blocks
#               (run before switching DNS; HTTP works, HTTPS still uses the
#               buffpp.com certificate until issue-cert runs)
#   issue-cert  obtain a Let's Encrypt certificate covering all domains with
#               certbot (run after DNS for lingo.ink points at this server)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect | prepare | issue-cert
        required: true
        default: inspect
      email:
        description: Contact email for Let's Encrypt (issue-cert only)
        required: false
        default: huruiw@outlook.com

env:
  EDGE_DOMAINS: buffpp.com www.buffpp.com lingo.ink www.lingo.ink

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      TENCENT_LIGHT_HOST: ${{ secrets.TENCENT_LIGHT_HOST }}
      TENCENT_LIGHT_USER: ${{ secrets.TENCENT_LIGHT_USER }}
      TENCENT_LIGHT_SSH_KEY: ${{ secrets.TENCENT_LIGHT_SSH_KEY }}
      TENCENT_LIGHT_PORT: ${{ vars.TENCENT_LIGHT_PORT }}
      TENCENT_LIGHT_TARGET_DIR: ${{ vars.TENCENT_LIGHT_TARGET_DIR }}
      MODE: ${{ inputs.mode }}
      CERT_EMAIL: ${{ inputs.email }}
    steps:
      - name: Validate settings
        shell: bash
        run: |
          set -euo pipefail
          for name in TENCENT_LIGHT_HOST TENCENT_LIGHT_USER TENCENT_LIGHT_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is required."
              exit 1
            fi
          done
          case "$MODE" in
            inspect|prepare|issue-cert) ;;
            *) echo "::error::Unknown mode '$MODE'"; exit 1 ;;
          esac
          echo "DEPLOY_PORT=${TENCENT_LIGHT_PORT:-22}" >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET_DIR=${TENCENT_LIGHT_TARGET_DIR:-/home/ubuntu/lingo-translate-proxy}" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$TENCENT_LIGHT_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" "$TENCENT_LIGHT_HOST" >> ~/.ssh/known_hosts

      - name: Run on the server
        shell: bash
        run: |
          set -uo pipefail
          ssh -p "$DEPLOY_PORT" -o LogLevel=ERROR "${TENCENT_LIGHT_USER}@${TENCENT_LIGHT_HOST}" \
            "MODE='$MODE' EDGE_DOMAINS='$EDGE_DOMAINS' CERT_EMAIL='$CERT_EMAIL' DEPLOY_TARGET_DIR='$DEPLOY_TARGET_DIR' bash -s" 2> ssh-stderr.log <<'REMOTE'
          set -euo pipefail
          trap 'echo "::error::Remote script failed at line $LINENO (exit $?)"' ERR

          mode="${MODE:?}"
          domains="${EDGE_DOMAINS:?}"
          website_dir="${DEPLOY_TARGET_DIR:?}/public-sites/lingoweb"
          echo "::notice::Connected; mode=$mode"

          if ! command -v nginx >/dev/null 2>&1; then
            echo "::error::nginx is not installed on this server; the edge is something else."
            exit 1
          fi

          # Locate every enabled Nginx config that mentions buffpp.com.
          mapfile -t configs < <(sudo -n grep -lE 'server_name[^;]*buffpp\.com' /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* 2>/dev/null || true)
          if [ "${#configs[@]}" -eq 0 ]; then
            echo "::error::No enabled Nginx config has a server_name with buffpp.com."
            sudo -n nginx -T 2>/dev/null | grep -E 'server_name|listen' | sort -u | head -n 20 | sed 's/^/::notice::nginx: /'
            exit 1
          fi
          echo "::notice::Nginx configs for buffpp.com: ${configs[*]}"

          report() {
            for cfg in "${configs[@]}"; do
              sudo -n grep -nE 'server_name|listen|ssl_certificate |root ' "$cfg" | tr -s ' ' | paste -sd'|' - | sed "s|^|::notice::$(basename "$cfg"): |"
            done
            if command -v certbot >/dev/null 2>&1; then
              sudo -n certbot certificates 2>/dev/null | grep -E 'Certificate Name|Domains|Expiry' | paste -sd'|' - | sed 's/^/::notice::certbot: /'
            else
              echo "::warning::certbot is not installed."
            fi
            for host in buffpp.com lingo.ink www.lingo.ink; do
              code="$(curl -sS -k --max-time 15 --resolve "$host:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$host/" 2>/dev/null || echo 000)"
              http="$(curl -sS --max-time 15 -H "Host: $host" -o /dev/null -w '%{http_code}' "http://127.0.0.1/" 2>/dev/null || echo 000)"
              echo "::notice::Local check $host: http $http, https $code"
            done
          }

          if [ "$mode" = "inspect" ]; then
            report
            exit 0
          fi

          if [ "$mode" = "prepare" ]; then
            changed=0
            for cfg in "${configs[@]}"; do
              if sudo -n grep -qE 'server_name[^;]*lingo\.ink' "$cfg"; then
                echo "::notice::$(basename "$cfg") already lists lingo.ink"
                continue
              fi
              sudo -n cp "$cfg" "$cfg.bak.$(date +%Y%m%d%H%M%S)"
              # Every server_name line that carries buffpp.com also gets the lingo.ink names.
              sudo -n sed -i -E 's/^(\s*server_name[^;]*buffpp\.com[^;]*);/\1 lingo.ink www.lingo.ink;/' "$cfg"
              changed=1
              echo "::notice::Added lingo.ink and www.lingo.ink to server_name in $(basename "$cfg")"
            done
            if [ "$changed" -eq 1 ]; then
              sudo -n nginx -t
              sudo -n systemctl reload nginx
              echo "::notice::Nginx reloaded"
            fi
            report
            exit 0
          fi

          if [ "$mode" = "issue-cert" ]; then
            if ! command -v certbot >/dev/null 2>&1; then
              echo "::error::certbot is not installed; cannot issue a certificate."
              exit 1
            fi
            args=()
            for d in $domains; do args+=(-d "$d"); done
            sudo -n certbot --nginx --non-interactive --agree-tos --expand --redirect \
              --email "${CERT_EMAIL:?}" "${args[@]}"
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            echo "::notice::Certificate issued/expanded for: $domains"
            report
            exit 0
          fi
          REMOTE
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::ssh exited with $code: $(tail -c 900 ssh-stderr.log | tr '\n' ' ')"
            exit "$code"
          fi

      - name: Report public DNS
        shell: bash
        run: |
          set -euo pipefail
          for host in lingo.ink www.lingo.ink buffpp.com; do
            addresses="$(dig +short "$host" 2>/dev/null | paste -sd, - || true)"
            echo "::notice::$host currently resolves to ${addresses:-nothing}"
          done
